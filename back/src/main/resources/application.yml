server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: hlsystem
  config:
    import: optional:file:./back/src/main/resources/application-local.yml,optional:file:./src/main/resources/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/hlsystem?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:hlsystem}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
app:
  demo:
    enabled: ${DEMO_ENABLED:false}
    expanded-enabled: ${DEMO_EXPANDED_ENABLED:false}
    password: ${DEMO_PASSWORD:}
